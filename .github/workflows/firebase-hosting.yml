name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_UKHUWAH_MART }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions

      - name: Deploy Hosting, Firestore Rules, and Functions
        run: npx --yes firebase-tools deploy --only hosting,firestore:rules,functions --project ukhuwah-mart
